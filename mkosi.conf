[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=uki
Output=rescue

[Content]
Bootloader=none
Bootable=false
KernelCommandLine=rw
Packages=
	base
	systemd
	systemd-ukify
	intel-ucode
	linux
	mkinitcpio
	linux-firmware
	coreutils
	pacman-mirrorlist
	networkmanager
	endeavouros-keyring
	endeavouros-mirrorlist
	arch-install-scripts
	vim
	zsh
	ripgrep
	fd
	sd
	less
	man-pages
	mandoc
	parted
	btrfs-progs
	ddrescue
	reflector
	eos-rankmirrors
	lvm2
	libfido2
	yubikey-manager
	bitwarden-cli
	 
RootPassword=rescue
Hostname=arch-rescue
Keymap=us
Timezone=Asia/Tokyo
Locale=en_US.UTF-8

[Validation]
SecureBoot=true
SecureBootKey=/boot/MOK.key
SecureBootCertificate=/boot/MOK.crt
